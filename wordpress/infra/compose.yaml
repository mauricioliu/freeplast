# Freeplast WordPress — isolated staging stack (issue #14).
#
# Deployed at /opt/freeplast-wordpress on OpenClaw behind the host Nginx
# (nginx/freeplast.mliu.site.conf; the full record lives in
# ../DEPLOYMENT.md). Every environment-specific value lives in .env —
# generated by deploy.sh on the server with mode 0600, never committed
# (.env.example documents the names and comments only).
#
#   docker compose --env-file .env config --quiet   # validate before up
#   docker compose --env-file .env up -d            # long-running services
#   docker compose --env-file .env run --rm cli …   # WP-CLI sidecar (on demand)
#
# Images are the multi-arch official ones (the host is ARM64); record the
# resolved digests in ../DEPLOYMENT.md at deploy time.
name: freeplast-wordpress

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?generate in .env with deploy.sh}
      MARIADB_DATABASE: ${MARIADB_DATABASE:?generate in .env with deploy.sh}
      MARIADB_USER: ${MARIADB_USER:?generate in .env with deploy.sh}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?generate in .env with deploy.sh}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - freeplast

  wordpress:
    image: wordpress:7.1-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Origin HTTP stays loopback-only; the host Nginx terminates TLS and
      # adds owner/client Basic Auth for the approved hostname.
      - "127.0.0.1:${FREEPLAST_LOOPBACK_PORT:-8092}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${MARIADB_DATABASE:?generate in .env with deploy.sh}
      WORDPRESS_DB_USER: ${MARIADB_USER:?generate in .env with deploy.sh}
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD:?generate in .env with deploy.sh}
      # Honor the Nginx-forwarded HTTPS scheme before WordPress computes
      # URLs, and remove dashboard file editing (OPENCLAW.md).
      WORDPRESS_CONFIG_EXTRA: |
        if ( isset( $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) && 'https' === $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) {
          $$_SERVER['HTTPS'] = 'on';
        }
        define( 'DISALLOW_FILE_EDIT', true );
      # Staging notification containment (issue #10): the plugin itself
      # also fails closed when unset; redirect additionally needs
      # FREEPLAST_CQ_MAIL_TO (an approved test address) in .env. live is a
      # production-only value and never a staging default.
      FREEPLAST_CQ_MAIL_MODE: ${FREEPLAST_CQ_MAIL_MODE:-suppress}
      FREEPLAST_CQ_MAIL_TO: ${FREEPLAST_CQ_MAIL_TO:-}
      # Optional Google Places/Routes key (console-restricted, never committed).
      FREEPLAST_GOOGLE_API_KEY: ${FREEPLAST_GOOGLE_API_KEY:-}
    volumes:
      - wp_data:/var/www/html
    networks:
      - freeplast

  cli:
    # WP-CLI sidecar sharing the WordPress volume and database network:
    # started only on demand through its profile, never with the stack.
    image: wordpress:cli-php8.3
    profiles:
      - tools
    user: "33:33"
    environment:
      HOME: /tmp
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${MARIADB_DATABASE:?generate in .env with deploy.sh}
      WORDPRESS_DB_USER: ${MARIADB_USER:?generate in .env with deploy.sh}
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD:?generate in .env with deploy.sh}
      FREEPLAST_CQ_MAIL_MODE: ${FREEPLAST_CQ_MAIL_MODE:-suppress}
      FREEPLAST_CQ_MAIL_TO: ${FREEPLAST_CQ_MAIL_TO:-}
      FREEPLAST_GOOGLE_API_KEY: ${FREEPLAST_GOOGLE_API_KEY:-}
    volumes:
      - wp_data:/var/www/html
      - ./bundle:/bundle:ro
    networks:
      - freeplast

volumes:
  db_data:
  wp_data:

networks:
  freeplast:
